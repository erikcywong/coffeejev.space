<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CoffeeJeV · 咖啡快判官</title>
<meta name="description" content="CoffeeJeV — 气雾栽培咖啡的判断层。3 分钟双语说明片（普通话 / English）。">
<meta property="og:title" content="CoffeeJeV · 咖啡快判官">
<meta property="og:description" content="A decision layer for aeroponic coffee. 3-minute explainer, 中文 / English.">
<meta property="og:type" content="video.other">
<meta property="og:url" content="https://www.coffeejev.space/">
<meta property="og:image" content="https://www.coffeejev.space/media/poster-zh.jpg">
<link rel="canonical" href="https://www.coffeejev.space/">
<style>
  :root{
    --tx:#e9ecf1; --dim:#8d97a5;
    --green:#00c48c; --green2:#3fe0b0; --line:#313945;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#08090b;overflow:hidden}
  body{
    height:100vh; height:100dvh;
    display:flex;align-items:center;justify-content:center;
    color:var(--tx);font-family:var(--font);
    background-image:
      radial-gradient(900px 480px at 12% -12%,rgba(0,196,140,.10),transparent 62%),
      radial-gradient(760px 420px at 92% -14%,rgba(224,162,78,.08),transparent 62%);
  }

  /* ---------- video: always the largest 16:9 rectangle that fits ---------- */
  video{
    display:block;
    width:min(100vw, calc(100vh * 16 / 9));
    height:min(100vh, calc(100vw * 9 / 16));
    width:min(100dvw, calc(100dvh * 16 / 9));
    height:min(100dvh, calc(100dvw * 9 / 16));
    object-fit:contain;
    background:#000;
  }

  /* ---------- overlay bar (never pushes the video, never needs scrolling) ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:5;
    display:flex;align-items:center;gap:clamp(8px,1.6vw,18px);
    padding:11px clamp(12px,2.2vw,24px) 26px;
    background:linear-gradient(180deg,rgba(0,0,0,.82),rgba(0,0,0,.45) 55%,transparent);
    transition:opacity .35s ease;
  }
  body.hideui header{opacity:0;pointer-events:none}

  .brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;flex-shrink:0}
  .mark{
    width:30px;height:30px;border-radius:9px;flex-shrink:0;
    background:linear-gradient(150deg,#123a2e,#0b1f18);
    border:1px solid rgba(0,196,140,.35);
    display:flex;align-items:center;justify-content:center;
  }
  .brand b{font-size:14.5px;font-weight:800;letter-spacing:.2px;white-space:nowrap}

  /* segmented control: both destinations same weight, neither reads as fine print */
  .switch{
    display:flex;align-items:center;gap:2px;padding:3px;flex-shrink:0;
    border-radius:999px;
    background:rgba(10,13,17,.72);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 2px 14px rgba(0,0,0,.35);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }
  .switch a{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:7px 15px;border-radius:999px;white-space:nowrap;text-decoration:none;
    font-size:12.5px;font-weight:700;letter-spacing:.2px;color:#d9e0e9;
    transition:background .18s,color .18s,box-shadow .18s;
  }
  .switch a svg{width:13px;height:13px;flex-shrink:0}
  .switch a:hover{color:#fff;background:rgba(255,255,255,.09)}
  .switch a.on{
    color:#f2fffa;
    background:linear-gradient(180deg,rgba(0,196,140,.34),rgba(0,196,140,.18));
    box-shadow:0 0 0 1px rgba(0,196,140,.5) inset, 0 2px 12px rgba(0,196,140,.18);
  }

  .spacer{flex:1;min-width:6px}
  .lang{display:flex;background:rgba(12,16,21,.85);border:1px solid var(--line);border-radius:999px;padding:2px;flex-shrink:0}
  .lang button{
    border:0;background:none;color:var(--dim);font:inherit;font-size:12px;font-weight:600;
    padding:5px 12px;border-radius:999px;cursor:pointer;transition:.15s;
  }
  .lang button.on{background:rgba(0,196,140,.16);color:#a9f3d8}
  .dl{
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;flex-shrink:0;
    font-size:12px;font-weight:600;color:#c9d2dd;
    border:1px solid var(--line);border-radius:8px;padding:6px 10px;
    background:rgba(17,20,26,.85);transition:.15s;
  }
  .dl:hover{border-color:rgba(0,196,140,.5);color:#fff}

  @media (max-width:620px){
    .brand b{display:none}
    .switch a{font-size:12px;padding:7px 12px;gap:6px}
    .lang button{padding:5px 10px;font-size:11.5px}
    .dl{display:none}
  }
  @media (max-width:420px){
    .switch a svg{display:none}
    .switch a{font-size:12px;padding:7px 11px}
  }
</style>
</head>
<body>
<header id="bar">
  <a class="brand" href="./" aria-label="CoffeeJeV home">
    <span class="mark" aria-hidden="true">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3fe0b0" stroke-width="1.8" stroke-linecap="round">
        <path d="M12 21c0-4.5 0-8 0-11"/><path d="M12 10c0 0-5-1-5-5 3.4 0 5 2 5 5Z"/>
        <path d="M12 13c0 0 5-1 5-5-3.4 0-5 2-5 5Z"/><path d="M8 21h8" stroke-opacity=".55"/>
      </svg>
    </span>
    <b>CoffeeJeV</b>
  </a>

  <nav class="switch" aria-label="Main">
    <a href="./" class="on" aria-current="page">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10.2-6.8c.6-.4.6-1.4 0-1.8L9.6 4.3C8.9 3.9 8 4.4 8 5.2Z"/></svg>
      视频
    </a>
    <a href="spec.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
        <path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h4"/>
      </svg>
      设计规格
    </a>
  </nav>

  <div class="spacer"></div>

  <div class="lang" id="langico" role="group" aria-label="Language">
    <button data-lang="zh" class="on">中文</button>
    <button data-lang="en">English</button>
  </div>
  <a class="dl" id="dl" href="media/coffeejev-zh-cn.mp4" download aria-label="Download video">
    <span aria-hidden="true">↓</span><span id="dltext">下载</span>
  </a>
</header>

<video id="v" controls playsinline preload="metadata" poster="media/poster-zh.jpg"></video>

<script>
  const SRC = {
    zh: { file: 'media/coffeejev-zh-cn.mp4', poster: 'media/poster-zh.jpg' },
    en: { file: 'media/coffeejev-en.mp4', poster: 'media/poster-en.jpg' }
  };
  const v = document.getElementById('v');
  const dl = document.getElementById('dl');
  const dltext = document.getElementById('dltext');
  let lang = localStorage.getItem('cjv-lang') || 'zh';

  function load(l) {
    lang = l;
    localStorage.setItem('cjv-lang', l);
    document.querySelectorAll('#langico button').forEach(b => b.classList.toggle('on', b.dataset.lang === l));
    dl.href = SRC[l].file;
    dltext.textContent = l === 'zh' ? '下载' : 'Download';
    document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en';

    const keep = v.currentTime || 0;
    const playing = !v.paused && keep > 0;
    v.poster = SRC[l].poster;
    v.src = SRC[l].file;
    v.load();
    v.addEventListener('loadedmetadata', () => {
      if (keep > 0 && keep < v.duration) v.currentTime = keep;
      if (playing) v.play().catch(() => {});
    }, { once: true });
  }

  document.querySelectorAll('#langico button').forEach(b =>
    b.addEventListener('click', () => { if (b.dataset.lang !== lang) load(b.dataset.lang); }));

  document.addEventListener('keydown', e => {
    if (e.key === 'l' || e.key === 'L') load(lang === 'zh' ? 'en' : 'zh');
  });

  // while playing, fade the top bar out after a moment (it comes back on mouse move)
  let hideTimer = null;
  function scheduleHide() {
    clearTimeout(hideTimer);
    if (v.paused) { document.body.classList.remove('hideui'); return; }
    hideTimer = setTimeout(() => document.body.classList.add('hideui'), 4200);
  }
  v.addEventListener('play', scheduleHide);
  v.addEventListener('pause', () => { clearTimeout(hideTimer); document.body.classList.remove('hideui'); });
  document.addEventListener('mousemove', () => {
    document.body.classList.remove('hideui');
    scheduleHide();
  });
  document.addEventListener('touchstart', () => {
    document.body.classList.remove('hideui');
    scheduleHide();
  }, { passive: true });

  load(lang);
</script>
</body>
</html>
