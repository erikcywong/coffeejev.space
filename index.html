<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoffeeJeV · 咖啡快判官</title>
<meta name="description" content="CoffeeJeV — 气雾栽培咖啡的判断层。3 分钟双语说明片（普通话 / English）。">
<meta property="og:title" content="CoffeeJeV · 咖啡快判官">
<meta property="og:description" content="A decision layer for aeroponic coffee. 3-minute explainer, 中文 / English.">
<meta property="og:type" content="video.other">
<meta property="og:url" content="https://www.coffeejev.space/">
<meta property="og:image" content="https://www.coffeejev.space/media/poster-zh.jpg">
<link rel="canonical" href="https://www.coffeejev.space/">
<style>
  :root{
    --tx:#e9ecf1; --dim:#8d97a5;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#08090b;color:var(--tx);font-family:var(--font);
    display:flex;flex-direction:column;min-height:100%;
    background-image:
      radial-gradient(900px 480px at 12% -12%,rgba(0,196,140,.10),transparent 62%),
      radial-gradient(760px 420px at 92% -14%,rgba(224,162,78,.08),transparent 62%);
  }
  header{display:flex;align-items:center;gap:14px;padding:20px clamp(16px,3vw,34px)}
  .mark{
    width:36px;height:36px;border-radius:10px;flex-shrink:0;
    background:linear-gradient(150deg,#123a2e,#0b1f18);
    border:1px solid rgba(0,196,140,.35);
    display:flex;align-items:center;justify-content:center;
  }
  .brand{font-size:16px;font-weight:800;letter-spacing:.2px}
  .spacer{flex:1}
  .lang{display:flex;background:#0c1015;border:1px solid #313945;border-radius:999px;padding:3px}
  .lang button{
    border:0;background:none;color:var(--dim);font:inherit;font-size:13px;font-weight:600;
    padding:6px 14px;border-radius:999px;cursor:pointer;transition:.15s;
  }
  .lang button.on{background:rgba(0,196,140,.14);color:#a9f3d8;box-shadow:0 0 0 1px rgba(0,196,140,.35) inset}
  .dl{
    display:inline-flex;align-items:center;gap:7px;text-decoration:none;
    font-size:12.5px;font-weight:600;color:#c9d2dd;
    border:1px solid #313945;border-radius:9px;padding:8px 12px;background:#11141a;transition:.15s;
  }
  .dl:hover{border-color:rgba(0,196,140,.5);color:#fff}
  main{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:0 clamp(16px,3vw,34px) clamp(20px,3vw,34px);
  }
  .frame{
    width:min(1400px,100%);border-radius:18px;overflow:hidden;
    border:1px solid rgba(255,255,255,.12);background:#000;
    box-shadow:0 30px 90px rgba(0,0,0,.65);
  }
  video{display:block;width:100%;aspect-ratio:16/9;background:#000}
  @media (max-width:560px){
    header{gap:10px;padding:14px}
    .brand{font-size:14.5px}
    .dl{display:none}
    .lang button{padding:6px 11px;font-size:12.5px}
    main{padding:0 12px 14px}
    .frame{border-radius:12px}
  }
</style>
</head>
<body>
<header>
  <div class="mark" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3fe0b0" stroke-width="1.7" stroke-linecap="round">
      <path d="M12 21c0-4.5 0-8 0-11"/><path d="M12 10c0 0-5-1-5-5 3.4 0 5 2 5 5Z"/>
      <path d="M12 13c0 0 5-1 5-5-3.4 0-5 2-5 5Z"/><path d="M8 21h8" stroke-opacity=".55"/>
    </svg>
  </div>
  <div class="brand">CoffeeJeV</div>
  <div class="spacer"></div>
  <div class="lang" id="langico" role="group" aria-label="Language">
    <button data-lang="zh" class="on">中文</button>
    <button data-lang="en">English</button>
  </div>
  <a class="dl" id="dl" href="media/coffeejev-zh-cn.mp4" download aria-label="Download video">
    <span aria-hidden="true">↓</span><span id="dltext">下载</span>
  </a>
</header>

<main>
  <div class="frame">
    <video id="v" controls playsinline preload="metadata" poster="media/poster-zh.jpg"></video>
  </div>
</main>

<script>
  const SRC = {
    zh: { file: 'media/coffeejev-zh-cn.mp4', poster: 'media/poster-zh.jpg' },
    en: { file: 'media/coffeejev-en.mp4', poster: 'media/poster-en.jpg' }
  };
  const v = document.getElementById('v');
  const dl = document.getElementById('dl');
  const dltext = document.getElementById('dltext');
  let lang = localStorage.getItem('cjv-lang') || 'zh';

  function load(l) {
    lang = l;
    localStorage.setItem('cjv-lang', l);
    document.querySelectorAll('#langico button').forEach(b => b.classList.toggle('on', b.dataset.lang === l));
    dl.href = SRC[l].file;
    dltext.textContent = l === 'zh' ? '下载' : 'Download';
    document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en';

    const keep = v.currentTime || 0;
    const playing = !v.paused && keep > 0;
    v.poster = SRC[l].poster;
    v.src = SRC[l].file;
    v.load();
    v.addEventListener('loadedmetadata', () => {
      if (keep > 0 && keep < v.duration) v.currentTime = keep;
      if (playing) v.play().catch(() => {});
    }, { once: true });
  }

  document.querySelectorAll('#langico button').forEach(b =>
    b.addEventListener('click', () => { if (b.dataset.lang !== lang) load(b.dataset.lang); }));

  document.addEventListener('keydown', e => {
    if (e.key === 'l' || e.key === 'L') load(lang === 'zh' ? 'en' : 'zh');
  });

  load(lang);
</script>
</body>
</html>
